name: Quality checks

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lightweight check dependencies
        run: python -m pip install numpy pandas requests
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile app.py inference.py inference2.py rag/*.py scripts/*.py
      - name: Check Git safety
        run: python scripts/check_git_safety.py
